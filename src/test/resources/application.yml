# Test profile: H2 in PostgreSQL-compatibility mode (MODE=PostgreSQL), same precedent this whole
# portfolio uses for a real PostgreSQL server not being available in this environment. Storage
# backend defaults to filesystem (a real temp directory per test class); the S3Mock-backed tests
# override worldsave.storage.* via @DynamicPropertySource once S3Mock's ephemeral port is known.
spring:
  datasource:
    url: jdbc:h2:mem:worldsave;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

worldsave:
  storage:
    backend: filesystem
    filesystem:
      root-dir: ./target/test-objectstore
